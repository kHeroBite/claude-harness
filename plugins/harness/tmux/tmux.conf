# ~/.tmux.conf
set -g default-terminal "xterm-256color"
set -g mouse on                    # 마우스 클릭/스크롤
set -g history-limit 50000         # Claude 출력 스크롤백 충분히
set -g base-index 1
set -g escape-time 0
set -g focus-events on

# DCS passthrough 허용 — tmux 3.3+ 필수. WT 외부 탭 OSC 0/2 직접 송출에 필요
# 출처: tmux FAQ + Codex 자문 결론 (2026-05-09). rename-window/refresh-client -S만으로는
# 외부 WT 탭 retitle 보장 안 됨. passthrough escape `\ePtmux;...\e\\`로 강제 송출 필요.
set -g allow-passthrough on

# 바깥 터미널 창 제목 = 프로젝트명(window 이름 첫 단어 — 앞에 아이콘 없음) + 메인 pane 이 작업 중일 때만 스피너 + window 이름 나머지.
# 스피너를 맨 끝에 두면 WT 탭 폭에서 잘려 안 보이므로(2026-11-01 캡처 실측) 프로젝트명 바로 뒤에 둔다.
# 스피너는 WT 탭 빨강과 같은 소스다(main_ask_state.sh 가 거는 @tab_color==on 과 @spin_t0, (%s−@spin_t0) mod 4 → ◜◝◞◟) — 둘이 함께 켜지고 꺼진다(2026-11-06).
# @tab_color 가 on 이 아니거나(ask·done·미설정) 죽은 pane 이면 스피너를 붙이지 않는다. 팀원 집계는 메인 테두리 점에만 나온다. 세션 status-interval 1 로 tmux 가 1초마다 창 제목을 다시 보낸다.
# 답변 대기(메인 pane @main_ask — main_ask_state.sh 가 질문·승인 창 동안 건다)면 스피너 없이 짝수 초엔 window 이름 전체, 홀수 초엔 '?' 한 글자만 낸다(팀 없는 IDLE pane 도). status-interval 1 에 의존한다.
# window 이름은 흐르게 하지 않고 고정으로 낸다(2026-11-05 마키 제거 — 상세·함정은 main_ask_fmt.sh 주석).
# 단일 출처는 .claude/hooks/lib/main_ask_fmt.sh 의 MAIN_TITLE_FMT 다. claude-as 도 같은 문자열을 건다(bin/claude-as 의 _CAS_TITLE_FMT)
# — 세 곳을 함께 고칠 것(시험 test_main_ask_state.sh -k sync 가 일치를 강제).
set -g set-titles on
set -g set-titles-string '#{?#{P:#{?#{&&:#{@main_ask},#{!:#{pane_dead}}},1,}},#{?#{e|==:#{e|%%:%s,2},0},#{window_name},?},#{P:#{?#{&&:#{!:#{pane_dead}},#{||:#{==:#{@tab_color},on},#{&&:#{@main_border_ver},#{==:#{@agent_state},run}}}},#{?#{e|==:#{e|%%:#{e|-:%s,#{@spin_t0}},4},0},◜,#{?#{e|==:#{e|%%:#{e|-:%s,#{@spin_t0}},4},1},◝,#{?#{e|==:#{e|%%:#{e|-:%s,#{@spin_t0}},4},2},◞,◟}}} ,}}#{window_name}}'

# 타일 레이아웃 자동 적용 (split-window 후 메인 30% + 우측 tiled)
set-hook -g after-split-window "run-shell 'TMUX_SESSION_ID=#{session_id} TMUX_WINDOW_ID=#{window_id} $HARNESS_HOME/current/scripts/tmux-main-tiled.sh'"

# 레이아웃 고정(락) — 외부 요인(Claude Code 등)이 레이아웃을 바꾸면 즉시
# 마지막으로 적용한 격자로 되돌린다 (스크립트 내 TMT_MODE=restore 분기가 처리)
set-hook -g window-layout-changed "run-shell 'TMT_MODE=restore TMUX_SESSION_ID=#{session_id} TMUX_WINDOW_ID=#{window_id} $HARNESS_HOME/current/scripts/tmux-main-tiled.sh'"

# control mode 상주 데몬 자동 기동 — 신규 세션 생성 시 세션별 데몬 1개 백그라운드 실행
# (세션명 인자 전달, 데몬 내부 flock으로 중복 기동 자체 차단 — 여기서는 단순 무조건 fork)
set-hook -g session-created "run-shell -b '$HARNESS_HOME/current/scripts/tmux-grid-daemon.sh #{session_name} >>/tmp/tmux-grid-daemon-#{session_name}.startup.log 2>&1'"

# Ctrl+휠 폰트 크기 변경을 터미널로 통과시키기
# WheelUp/DownPane에서 Ctrl 수식자 이벤트를 unbind하여 터미널이 처리하도록 함
unbind -T root C-WheelUpPane
unbind -T root C-WheelDownPane

# 우클릭 메뉴: 기본 메뉴에 Paste 항목 추가 (Copy Line 바로 뒤)
# MouseUp3Pane 사용 — MouseDown3Pane은 mouse-up 시 메뉴가 자동 닫힘 (LESSONS L-NEW-C)
bind-key -T root MouseUp3Pane \
  if-shell -F -t = "#{||:#{mouse_any_flag},#{&&:#{pane_in_mode},#{?#{m/r:(copy|view)-mode,#{pane_mode}},0,1}}}" \
  { select-pane -t = ; send-keys -M } \
  { display-menu -T "#[align=centre]#{pane_index} (#{pane_id})" -t = -x M -y M \
    "#{?#{m/r:(copy|view)-mode,#{pane_mode}},Go To Top,}" < { send-keys -X history-top } \
    "#{?#{m/r:(copy|view)-mode,#{pane_mode}},Go To Bottom,}" > { send-keys -X history-bottom } \
    '' \
    "#{?mouse_word,Search For #[underscore]#{=/9/...:mouse_word},}" C-r { if-shell -F "#{?#{m/r:(copy|view)-mode,#{pane_mode}},0,1}" "copy-mode -t=" ; send-keys -X -t = search-backward -- "#{q:mouse_word}" } \
    "#{?mouse_word,Type #[underscore]#{=/9/...:mouse_word},}" C-y { copy-mode -q ; send-keys -l "#{q:mouse_word}" } \
    "#{?mouse_word,Copy #[underscore]#{=/9/...:mouse_word},}" c { copy-mode -q ; set-buffer "#{q:mouse_word}" } \
    "#{?mouse_line,Copy Line,}" l { copy-mode -q ; set-buffer "#{q:mouse_line}" } \
    "Paste" p { paste-buffer -p } \
    '' \
    "#{?mouse_hyperlink,Type #[underscore]#{=/9/...:mouse_hyperlink},}" C-h { copy-mode -q ; send-keys -l "#{q:mouse_hyperlink}" } \
    "#{?mouse_hyperlink,Copy #[underscore]#{=/9/...:mouse_hyperlink},}" h { copy-mode -q ; set-buffer "#{q:mouse_hyperlink}" } \
    '' \
    "Horizontal Split" h { split-window -h } \
    "Vertical Split" v { split-window -v } \
    '' \
    "#{?#{>:#{window_panes},1},,-}Swap Up" u { swap-pane -U } \
    "#{?#{>:#{window_panes},1},,-}Swap Down" d { swap-pane -D } \
    "#{?pane_marked_set,,-}Swap Marked" s { swap-pane } \
    '' \
    Kill X { kill-pane } \
    Respawn R { respawn-pane -k } \
    "#{?pane_marked,Unmark,Mark}" m { select-pane -m } \
    "#{?#{>:#{window_panes},1},,-}#{?window_zoomed_flag,Unzoom,Zoom}" z { resize-pane -Z } \
  }

# claude 종료 시 pane 자동 닫기 (bash 노출 방지)
set-hook -g pane-died "kill-pane -t '#{pane_id}'"

# 드래그 종료 시 Windows 클립보드로 자동 복사 (UTF-8 보존)
# PowerShell Set-Clipboard: UTF-8 stdin 정상 처리 (clip.exe는 한글/이모지 깨짐)
bind-key -T copy-mode-vi MouseDragEnd1Pane \
  send-keys -X copy-pipe-no-clear "$HARNESS_HOME/current/scripts/tmux-clip-export.sh -"
bind-key -T root MouseDragEnd1Pane \
  send-keys -X copy-pipe-and-cancel "$HARNESS_HOME/current/scripts/tmux-clip-export.sh -"

# paste-buffer 갱신 시마다 Windows 클립보드(clip.exe)로 자동 export
# tmux 3.6a에서 pane-set-clipboard hook 없음 → after-set-buffer 사용
# 별도 스크립트로 분리해야 background hook에서 redirect 정상 작동
set-hook -g after-set-buffer "run-shell -b $HARNESS_HOME/current/scripts/tmux-clip-export.sh"
set-hook -g after-copy-mode "run-shell -b $HARNESS_HOME/current/scripts/tmux-clip-export.sh"
